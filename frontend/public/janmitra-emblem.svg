<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="embSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="embGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="embNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D59" />
      <stop offset="100%" stop-color="#071830" />
    </linearGradient>
    <linearGradient id="embGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="64" cy="64" r="60" fill="url(#embNavy)" stroke="url(#embGold)" stroke-width="3" />

  <!-- Tricolor Arcs -->
  <!-- Saffron Top Half -->
  <path d="M 16 64 A 48 48 0 0 1 112 64" fill="none" stroke="url(#embSaffron)" stroke-width="8" stroke-linecap="round" />
  <!-- Green Bottom Half -->
  <path d="M 112 64 A 48 48 0 0 1 16 64" fill="none" stroke="url(#embGreen)" stroke-width="8" stroke-linecap="round" />

  <!-- Center White Shield Disc -->
  <circle cx="64" cy="64" r="41" fill="#FFFFFF" />

  <!-- Ashoka Chakra subtle ring -->
  <circle cx="64" cy="64" r="33" fill="none" stroke="#0F2D59" stroke-width="1.5" opacity="0.25" stroke-dasharray="2,3" />

  <!-- City Skyline -->
  <g fill="#1E293B">
    <!-- Left Building -->
    <rect x="42" y="44" width="9" height="26" fill="#334155" rx="1" />
    <!-- Center Headquarters with Flag Mast -->
    <rect x="54" y="32" width="16" height="38" fill="#0F172A" rx="1" />
    <polygon points="54,32 62,22 70,32" fill="#0D2A53" />
    <!-- Golden beacon light -->
    <circle cx="62" cy="20" r="2.5" fill="#EAB308" />
    <!-- Right Building -->
    <rect x="73" y="40" width="12" height="30" fill="#475569" rx="1" />
  </g>

  <!-- PWD Road Highway Triangle Sweeping Down -->
  <path d="M 50 94 L 59 62 L 65 62 L 78 94 Z" fill="#334155" />
  <line x1="62" y1="65" x2="62" y2="72" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="63" y1="76" x2="63" y2="89" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

  <!-- Clean Water Droplet (Right) -->
  <path d="M 86 64 C 86 58, 89 54, 91 50 C 93 54, 96 58, 96 64 C 96 68, 93 71, 91 71 C 88 71, 86 68, 86 64 Z" fill="#0284C7" />

  <!-- Sanitation Green Leaf (Left) -->
  <path d="M 40 76 C 30 72, 28 60, 38 57 C 41 64, 41 71, 40 76 Z" fill="url(#embGreen)" />

  <!-- Golden Base Arc -->
  <path d="M 32 94 Q 64 108 96 94" fill="none" stroke="url(#embGold)" stroke-width="3" stroke-linecap="round" />

  <!-- Central 'JM' Monogram / Text Banner -->
  <rect x="29" y="96" width="70" height="15" rx="7.5" fill="url(#embNavy)" stroke="url(#embGold)" stroke-width="1.2" />
  <text x="64" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
    JANMITRA
  </text>
</svg>
